services:
  redis:
    image: redis:7-alpine
    container_name: traco-sdr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  waha:
    image: devlikeapro/waha
    container_name: traco-sdr-waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY:?Preencha WAHA_API_KEY em .env.local}"
      WHATSAPP_HOOK_URL: "http://host.docker.internal:10000/webhooks/waha"
      WHATSAPP_HOOK_EVENTS: "message"
      WHATSAPP_HOOK_HMAC_KEY: "${WAHA_WEBHOOK_HMAC_KEY:?Preencha WAHA_WEBHOOK_HMAC_KEY em .env.local}"
      WHATSAPP_HOOK_RETRIES_POLICY: "exponential"
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "5"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  redis_data:
  waha_sessions:
